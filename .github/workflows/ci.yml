name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.22.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check Go formatting before installing development dependencies
        shell: bash
        run: test -z "$(gofmt -l .)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go test -count=1 . ./internal/...
      - run: go vet . ./internal/...
      - run: go build . ./internal/...
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        name: Core coverage, races and parser fuzzing
        shell: bash
        run: |
          go test -coverprofile=coverage.out ./internal/agent
          go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); if ($3 + 0 < 85) exit 1 }'
          go test -race -count=1 . ./internal/...
          go test -run '^$' -fuzz '^FuzzOfflineParser$' -fuzztime=30s ./internal/agent
