name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.22.x', stable]
        # macos-latest 已是 macOS 15 / arm64 镜像，Go 1.22 的 darwin/arm64 运行时
        # 在其上启动即 abort trap（测试二进制 4ms 退出，未执行任何用例）。
        # 因此最低版本固定到 macOS 14 镜像验证，最新版仍在 macos-latest 验证。
        exclude:
          - os: macos-latest
            go: '1.22.x'
        include:
          - os: macos-14
            go: '1.22.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check Go formatting before installing development dependencies
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未按 gofmt 格式化（Windows 上通常是检出为 CRLF 导致）："
            echo "$files"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        shell: bash
        run: |
          log=gotest.log
          if go test -count=1 . ./internal/... 2>&1 | tee "$log"; then
            exit 0
          fi
          # 失败时把环境与关键错误行同时写入步骤摘要和检查注解，
          # 评审无需下载日志即可判断是环境问题还是用例问题。
          {
            echo "### go test 失败"
            echo ""
            echo "平台：${{ matrix.os }} / Go ${{ matrix.go }}"
            echo ""
            go version
            uname -a
            go env GOOS GOARCH CGO_ENABLED
            echo ""
            echo '```'
            tail -40 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          n=0
          while IFS= read -r line; do
            if [ -z "$line" ]; then
              continue
            fi
            echo "::error::${line//\%/%25}"
            n=$((n + 1))
            if [ "$n" -ge 8 ]; then
              break
            fi
          done < <(grep -E 'FAIL|panic|undefined|cannot|error|Error|no such file|killed|signal|_test\.go:' "$log" | head -8 || true)
          exit 1
      - run: go vet . ./internal/...
      - run: go build . ./internal/...
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        name: Core coverage, races and parser fuzzing
        shell: bash
        run: |
          go test -coverprofile=coverage.out ./internal/agent
          go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); if ($3 + 0 < 85) exit 1 }'
          go test -race -count=1 . ./internal/...
          go test -run '^$' -fuzz '^FuzzOfflineParser$' -fuzztime=30s ./internal/agent
