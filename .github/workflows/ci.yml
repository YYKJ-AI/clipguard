name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.22.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
      - run: node --test tests/web.test.cjs
      - run: node --check web/app.js
      - if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -race ./...
